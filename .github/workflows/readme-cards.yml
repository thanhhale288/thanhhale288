name: Update README cards

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats, languages, and streak cards
        run: |
          mkdir -p profile
          USER="${{ github.repository_owner }}"

          # Public github-readme-stats.vercel.app is often paused; use a working mirror.
          curl -fsSL \
            "https://github-readme-stats-sigma-five.vercel.app/api?username=${USER}&show_icons=true&theme=radical&hide_border=true&bg_color=0D1117&title_color=00F0FF&icon_color=00F0FF&text_color=E6EDF3&ring_color=00F0FF" \
            -o profile/stats.svg

          curl -fsSL \
            "https://github-readme-stats-sigma-five.vercel.app/api/top-langs/?username=${USER}&layout=compact&theme=radical&hide_border=true&bg_color=0D1117&title_color=00F0FF&text_color=E6EDF3" \
            -o profile/top-langs.svg

          curl -fsSL \
            "https://streak-stats.demolab.com?user=${USER}&theme=dark&hide_border=true&background=0D1117&ring=00F0FF&fire=00F0FF&currStreakLabel=00F0FF&sideLabels=E6EDF3&dates=8B949E" \
            -o profile/streak.svg

          python3 - <<'PY'
          from pathlib import Path
          for name in ["stats.svg", "top-langs.svg", "streak.svg"]:
              p = Path("profile") / name
              t = p.read_text(encoding="utf-8", errors="ignore")
              i = t.find("<svg")
              if i < 0:
                  raise SystemExit(f"{name}: not an SVG")
              t = t[i:]
              if "Something went wrong" in t or "DEPLOYMENT_PAUSED" in t:
                  raise SystemExit(f"{name}: upstream returned an error card")
              p.write_text(t, encoding="utf-8")
              print(name, "ok", p.stat().st_size)
          PY

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg profile/streak.svg
          if git diff --staged --quiet; then
            echo "No card changes"
            exit 0
          fi
          git commit -m "chore: refresh profile README cards"
          git pull --rebase origin main
          git push
